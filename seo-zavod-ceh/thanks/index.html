<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#faf9f4">
  <title>Спасибо · Snezhko AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#faf9f4;color:#202925;font:18px/1.65 system-ui,sans-serif}
    main{width:min(100% - 36px,38rem);margin:clamp(3rem,14vh,9rem) auto}header{border-bottom:1px solid #b8c5b8;padding-bottom:1rem}
    header a{color:#202925;text-decoration:none;font-weight:750}h1{font:500 clamp(2.8rem,9vw,4.8rem)/1.05 Georgia,serif;letter-spacing:-.035em;margin:2.2rem 0 1rem}
    p{color:#46564d;max-width:49ch}a{color:#19563f;text-underline-offset:.2em}a:focus-visible{outline:3px solid #bd4b17;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <header><a href="/">Snezhko AI</a></header>
    <h1>Спасибо!</h1>
    <p>Статус участия и доступ к материалам «Цеха» можно проверить у организатора. Здесь вы можете вернуться к разбору о работе с SEO-статьями.</p>
    <a href="../">Вернуться к статье</a>
  </main>
  <script>
    (() => {
      // This measures a return after an outbound click, not a paid membership.
      if (location.href !== 'https://snezhko.ru/seo-zavod-ceh/thanks/?thanks=87654') return;
      const maxAge = 30 * 60 * 1000;
      try {
        if (sessionStorage.getItem('ceh.thanks.viewed')) return;
        const clickedAt = Number(sessionStorage.getItem('ceh.join.clickedAt'));
        const age = Date.now() - clickedAt;
        if (!(clickedAt > 0 && age >= 0 && age <= maxAge)) return;
        sessionStorage.setItem('ceh.thanks.viewed', '1');
        sessionStorage.removeItem('ceh.join.clickedAt');
      } catch { return; }

      window.ym = window.ym || function () { (window.ym.a = window.ym.a || []).push(arguments); };
      window.ym.l = window.ym.l || Date.now();
      const tag = document.createElement('script');
      tag.src = 'https://mc.yandex.ru/metrika/tag.js';
      tag.async = true;
      document.head.appendChild(tag);
      // Normal init records this one pageview for the exact-URL goal.
      window.ym(112187050, 'init', {webvisor: false, clickmap: false, trackLinks: false});
    })();
  </script>
</body>
</html>
